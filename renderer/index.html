<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>速贴 ClipFast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="authView" class="auth-shell" hidden>
      <section class="auth-brand" aria-hidden="true">
        <div class="brand-lockup">
          <span class="brand-mark">C</span>
          <span class="brand-name">ClipFast 速贴</span>
        </div>
        <h2 class="brand-headline">剪贴板，<br />快人一步</h2>
        <p class="brand-copy">复制的内容自动整理成可搜索、可收藏的记录，粘贴时不用再翻找聊天记录。</p>
        <ul class="brand-points">
          <li>
            <span class="point-dot"></span>
            本地存储，数据不出设备
          </li>
          <li>
            <span class="point-dot"></span>
            智能搜索与类型筛选
          </li>
          <li>
            <span class="point-dot"></span>
            收藏与一键粘贴
          </li>
        </ul>
      </section>

      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-form-panel">
          <h1 id="authTitle" class="auth-title">登录 ClipFast</h1>
          <p class="auth-subtitle" id="authDescription">使用邮箱密码继续</p>

        <div id="authNotice" class="auth-notice" hidden></div>
        <div id="authError" class="auth-error" hidden></div>

        <div class="auth-tabs" role="tablist">
          <button id="showLogin" class="auth-tab active" type="button">登录</button>
          <button id="showRegister" class="auth-tab" type="button">注册</button>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <label class="auth-field">
            <span>邮箱</span>
            <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="auth-field">
            <span>密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required />
          </label>
          <button class="auth-submit" type="submit">登录</button>
          <button id="showReset" class="auth-link" type="button">忘记密码？</button>
        </form>

        <form id="registerForm" class="auth-form" hidden novalidate>
          <label class="auth-field">
            <span>邮箱</span>
            <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="auth-field">
            <span>密码</span>
            <input id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位" required />
          </label>
          <label class="auth-field">
            <span>确认密码</span>
            <input id="registerConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入密码" required />
          </label>
          <button class="auth-submit" type="submit">创建账号</button>
          <button id="showLoginFromRegister" class="auth-link" type="button">返回登录</button>
        </form>

        <form id="resetForm" class="auth-form" hidden novalidate>
          <label class="auth-field">
            <span>邮箱</span>
            <input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <button class="auth-submit" type="submit">发送重置邮件</button>
          <button id="showLoginFromReset" class="auth-link" type="button">返回登录</button>
        </form>
        </div>
      </section>
    </div>

    <div id="appRoot" class="app-container" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark compact">C</span>
          <div>
            <div class="sidebar-app">ClipFast</div>
            <div class="sidebar-label">速贴工作区</div>
          </div>
        </div>

        <div class="sidebar-section">分类</div>
        <nav class="nav-menu">
          <button data-type="all" class="nav-item active">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </span>
            <span class="nav-label">全部</span>
          </button>
          <button data-type="text" class="nav-item">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </span>
            <span class="nav-label">文本</span>
          </button>
          <button data-type="link" class="nav-item">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </span>
            <span class="nav-label">链接</span>
          </button>
          <button data-type="code" class="nav-item">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </span>
            <span class="nav-label">代码</span>
          </button>
          <button data-type="image" class="nav-item">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </span>
            <span class="nav-label">图片</span>
          </button>
          <button data-type="video" class="nav-item">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
            </span>
            <span class="nav-label">视频</span>
          </button>
        </nav>
      </aside>
      
      <main class="main-content">
        <header class="top-bar">
          <div class="toolbar">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input id="search" type="text" placeholder="搜索关键词或标签..." />
            </div>
            
            <button id="toggleFav" class="action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <span class="action-label">仅收藏</span>
            </button>
            
            <button id="clearAll" class="action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              <span class="action-label">清空</span>
            </button>
            
            <button id="openShortcut" class="action-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"></path></svg>
              <span class="action-label">快捷键</span>
            </button>

            <div class="account-wrap">
              <button id="accountButton" class="account-chip" aria-haspopup="true">
                <span class="account-avatar">C</span>
                <span id="accountEmail" class="account-email">未登录</span>
                <svg class="account-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div id="accountMenu" class="account-menu" hidden>
                <div class="account-menu-label">已登录账号</div>
                <button id="signOutButton" type="button">退出登录</button>
              </div>
            </div>
          </div>

          <div id="undoMsg" class="undo-msg" style="display: none;">
            已将重复内容移动到顶部 <a href="#" id="undoBtn">撤销</a>
          </div>
        </header>
        
        <div class="list-container" id="list">
          <!-- Cards will be injected here -->
        </div>
      </main>
    </div>

    <div id="shortcutModal" class="modal">
      <div class="modal-body">
        <div class="modal-title">按下你想要的快捷键组合</div>
        <div class="field">
          <div class="label">快捷键</div>
          <div class="keys" id="shortcutPreviewKeys"></div>
        </div>
        <div class="desc"><span class="keys-inline" id="shortcutCurrentKeys"></span></div>
        <div class="modal-actions">
          <button id="saveShortcut" class="btn primary" disabled>保存</button>
          <button id="cancelShortcut" class="btn">取消</button>
        </div>
      </div>
    </div>
    <div id="confirmModal" class="modal confirm-modal">
      <div class="modal-body confirm-body">
        <div class="confirm-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>
        <h2 id="confirmTitle" class="confirm-title">确认操作</h2>
        <p id="confirmMessage" class="confirm-message">此操作不可恢复。</p>
        <div class="modal-actions">
          <button id="confirmCancel" class="btn" type="button">取消</button>
          <button id="confirmAction" class="btn danger" type="button">删除</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
